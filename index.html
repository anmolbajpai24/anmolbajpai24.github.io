    <meta
      name="description"
      content="Software engineer. Three years of game UI in Unity UI Toolkit on a live mobile game, web products, and a public robot-learning log."
    />
    <meta property="og:title" content="Anmol Bajpai · software engineer" />

    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f4ee"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#191613"
    />
    <script>
      // Set theme before first paint to avoid a flash of the wrong scheme.
      // localStorage can throw (blocked storage, sandboxed frames) — the
      // system-preference fallback must still run.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
